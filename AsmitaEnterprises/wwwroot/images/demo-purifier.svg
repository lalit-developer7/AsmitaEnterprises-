<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="dBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="dWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="dSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <ellipse cx="250" cy="360" rx="200" ry="18" fill="#0f172a" opacity="0.08"/>

  <!-- Water Purifier Cabinet -->
  <g filter="url(#dSh)" transform="translate(180, 40)">
    <rect x="0" y="0" width="220" height="300" rx="16" fill="url(#dBody)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 0 16 Q 0 0 16 0 L 204 0 Q 220 0 220 16 L 220 140 L 0 140 Z" fill="url(#dBlue)"/>
    <rect x="15" y="20" width="190" height="105" rx="8" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff"/>
    <rect x="30" y="35" width="160" height="22" rx="11" fill="#ffffff"/>
    <rect x="30" y="65" width="160" height="22" rx="11" fill="#ffffff"/>
    <rect x="0" y="140" width="220" height="160" fill="#ffffff"/>
    <path d="M 0 284 Q 0 300 16 300 L 204 300 Q 220 300 220 284 L 220 140 L 0 140 Z" fill="#ffffff"/>
    <circle cx="110" cy="250" r="8" fill="#0284c7"/>
  </g>

  <!-- Glass of Pure Water beside it -->
  <g transform="translate(90, 200)">
    <polygon points="10,20 60,20 50,130 20,130" fill="url(#dWater)" stroke="#ffffff" stroke-width="3"/>
    <ellipse cx="35" cy="20" rx="25" ry="6" fill="#e0f2fe"/>
    <!-- Water droplets pouring -->
    <circle cx="35" cy="-30" r="3" fill="#38bdf8"/>
    <circle cx="35" cy="-10" r="4" fill="#0284c7"/>
  </g>
</svg>
