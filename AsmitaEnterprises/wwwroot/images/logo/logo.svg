<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 90" width="450" height="90">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="innerDrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Water Drop Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Ring/Swirl -->
    <path d="M 40 5 C 65 5 80 25 80 45 C 80 68 62 82 40 82 C 18 82 0 68 0 45 C 0 30 12 12 32 6" fill="none" stroke="url(#dropGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Main Drop -->
    <path d="M 40 16 C 40 16 62 44 62 55 C 62 67 52 76 40 76 C 28 76 18 67 18 55 C 18 44 40 16 40 16 Z" fill="url(#dropGrad)"/>
    <!-- Highlight Swirl inside drop -->
    <path d="M 40 24 C 40 24 54 46 54 54 C 54 61 48 67 40 67 C 34 67 30 62 30 56 C 30 48 40 24 40 24 Z" fill="url(#innerDrop)"/>
  </g>
  <!-- Brand Text -->
  <text x="105" y="42" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#0f172a">ASMITA</text>
  <text x="105" y="65" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="20" letter-spacing="3" fill="#0284c7">ENTERPRISES</text>
  <text x="105" y="80" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="11" letter-spacing="0.5" fill="#0369a1">Pure Water. Better Health.</text>
</svg>
