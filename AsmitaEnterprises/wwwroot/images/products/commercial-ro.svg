<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="vessel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="pSh4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="360" rx="150" ry="15" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#pSh4)" transform="translate(60, 40)">
    <!-- Stainless Steel Frame -->
    <rect x="0" y="0" width="280" height="300" rx="4" fill="none" stroke="url(#metal)" stroke-width="12"/>
    <line x1="0" y1="100" x2="280" y2="100" stroke="url(#metal)" stroke-width="8"/>
    <line x1="0" y1="200" x2="280" y2="200" stroke="url(#metal)" stroke-width="8"/>

    <!-- High Flow Pressure Vessels / FRP Tanks -->
    <rect x="30" y="20" width="40" height="260" rx="10" fill="url(#vessel)"/>
    <rect x="85" y="20" width="40" height="260" rx="10" fill="url(#vessel)"/>
    
    <!-- Stainless Steel RO Membrane Housings -->
    <rect x="145" y="40" width="115" height="35" rx="6" fill="url(#metal)"/>
    <rect x="145" y="120" width="115" height="35" rx="6" fill="url(#metal)"/>
    <rect x="145" y="200" width="115" height="35" rx="6" fill="url(#metal)"/>

    <!-- Commercial High Pressure Pump -->
    <rect x="155" y="245" width="70" height="45" rx="4" fill="#0f172a"/>
    <circle cx="210" cy="267" r="14" fill="#334155"/>
  </g>
</svg>
