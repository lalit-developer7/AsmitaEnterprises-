<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="blueCanister" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="pSh5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <ellipse cx="200" cy="360" rx="140" ry="15" fill="#0f172a" opacity="0.08"/>
  <g filter="url(#pSh5)" transform="translate(80, 50)">
    <!-- Mounting Bracket -->
    <rect x="0" y="0" width="240" height="35" rx="6" fill="#0f172a"/>
    <circle cx="40" cy="17" r="8" fill="#e2e8f0"/>
    <circle cx="120" cy="17" r="8" fill="#e2e8f0"/>
    <circle cx="200" cy="17" r="8" fill="#e2e8f0"/>

    <!-- 3 Big Blue Filter Housings -->
    <rect x="15" y="45" width="55" height="230" rx="10" fill="url(#blueCanister)"/>
    <rect x="92" y="45" width="55" height="230" rx="10" fill="url(#blueCanister)"/>
    <rect x="170" y="45" width="55" height="230" rx="10" fill="url(#blueCanister)"/>

    <!-- Pressure Gauge -->
    <circle cx="120" cy="-10" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <line x1="120" y1="-10" x2="128" y2="-18" stroke="#ef4444" stroke-width="2"/>

    <!-- Connecting Tubes -->
    <path d="M 40 45 L 40 35 L 120 35 L 120 45" fill="none" stroke="#cbd5e1" stroke-width="6"/>
    <path d="M 120 45 L 120 35 L 200 35 L 200 45" fill="none" stroke="#cbd5e1" stroke-width="6"/>
  </g>
</svg>
