<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="blueTransparent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="waterLevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="filterBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Reflection/Shadow -->
  <ellipse cx="400" cy="540" rx="360" ry="25" fill="#0f172a" opacity="0.08"/>

  <!-- Left Secondary Compact Cabinet -->
  <g filter="url(#dropShadow)" transform="translate(140, 140)">
    <rect x="0" y="0" width="130" height="360" rx="16" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 0 16 Q 0 0 16 0 L 114 0 Q 130 0 130 16 L 130 100 L 0 100 Z" fill="#0f172a"/>
    <rect x="15" y="120" width="100" height="210" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <!-- Filter Candle inside -->
    <rect x="35" y="135" width="60" height="180" rx="30" fill="#ffffff" stroke="#cbd5e1"/>
    <line x1="35" y1="180" x2="95" y2="180" stroke="#0284c7" stroke-width="4"/>
    <line x1="35" y1="240" x2="95" y2="240" stroke="#0284c7" stroke-width="4"/>
  </g>

  <!-- Central Main RO+UV Purifier (Asmita Signature Cabinet) -->
  <g filter="url(#dropShadow)" transform="translate(290, 80)">
    <!-- Base Cabinet -->
    <rect x="0" y="0" width="250" height="430" rx="20" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Top Blue Translucent Tank Section -->
    <path d="M 0 20 Q 0 0 20 0 L 230 0 Q 250 0 250 20 L 250 210 L 0 210 Z" fill="url(#blueTransparent)"/>
    
    <!-- Transparent Window / Internal RO Membrane & Cartridges -->
    <rect x="20" y="25" width="210" height="165" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- RO Membrane Filters inside top tank -->
    <rect x="35" y="40" width="180" height="32" rx="16" fill="#ffffff" opacity="0.95"/>
    <rect x="35" y="80" width="180" height="32" rx="16" fill="#ffffff" opacity="0.95"/>
    <rect x="35" y="120" width="180" height="32" rx="16" fill="#ffffff" opacity="0.95"/>
    
    <!-- Water Level Animation Line -->
    <path d="M 20 140 Q 75 135 125 140 T 230 140 L 230 190 Q 230 195 225 195 L 25 195 Q 20 195 20 190 Z" fill="url(#waterLevel)"/>

    <!-- Bottom White Body Section -->
    <rect x="0" y="210" width="250" height="220" rx="0" fill="#ffffff"/>
    <path d="M 0 410 Q 0 430 20 430 L 230 430 Q 250 430 250 410 L 250 210 L 0 210 Z" fill="#ffffff"/>
    
    <!-- Center Black Digital Panel / Indicator -->
    <rect x="110" y="235" width="30" height="120" rx="15" fill="#0f172a"/>
    <circle cx="125" cy="255" r="5" fill="#38bdf8"/>
    <circle cx="125" cy="285" r="4" fill="#22c55e"/>
    <circle cx="125" cy="315" r="4" fill="#38bdf8"/>

    <!-- Tap Dispenser -->
    <path d="M 120 370 L 130 370 L 128 390 L 122 390 Z" fill="url(#chrome)"/>
    <circle cx="125" cy="365" r="8" fill="#0284c7"/>
  </g>

  <!-- Right Triple Blue Pre-Filter Assembly & Chrome Faucet Glass -->
  <g filter="url(#dropShadow)" transform="translate(560, 130)">
    <!-- Triple Blue Canisters -->
    <rect x="0" y="30" width="45" height="190" rx="8" fill="url(#filterBlue)"/>
    <rect x="52" y="30" width="45" height="190" rx="8" fill="url(#filterBlue)"/>
    <rect x="104" y="30" width="45" height="190" rx="8" fill="url(#filterBlue)"/>
    <!-- Top Mounting Bracket -->
    <rect x="-5" y="10" width="160" height="25" rx="5" fill="#0f172a"/>
    <circle cx="22" cy="22" r="6" fill="#cbd5e1"/>
    <circle cx="74" cy="22" r="6" fill="#cbd5e1"/>
    <circle cx="126" cy="22" r="6" fill="#cbd5e1"/>

    <!-- Chrome Swan-Neck Faucet -->
    <path d="M 170 200 C 170 80 200 40 180 20 C 170 10 150 30 150 50" fill="none" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 150 50 L 150 70" fill="none" stroke="url(#chrome)" stroke-width="8"/>
    
    <!-- Water Glass with Droplet -->
    <polygon points="135,160 165,160 160,220 140,220" fill="url(#waterLevel)" opacity="0.85" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="150" cy="160" rx="15" ry="4" fill="#e0f2fe" opacity="0.9"/>
  </g>
</svg>
